# Frigate NVR Configuration for 4x Sonoff CAM-PT2 (Thingino firmware)
# Mosquitto broker at 192.168.6.1
# Cameras on 192.168.5.1-4
# No Home Assistant integration — standalone Frigate + MQTT

mqtt:
  enabled: true
  host: 192.168.6.1
  port: 1883
  topic_prefix: frigate
  # Uncomment and set if your broker requires auth:
  # user: mqtt_user
  # password: mqtt_password

detectors:
  ov:
    type: openvino
    device: AUTO
    model:
      path: /openvino-model/ssdlite_mobilenet_v2.xml

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

ffmpeg:
  hwaccel_args: preset-vaapi

go2rtc:
  streams:
    ptz_01:
      - rtsp://thingino:thingino@192.168.5.1:554/ch0#backchannel=0#timeout=30
    ptz_01_sub:
      - rtsp://thingino:thingino@192.168.5.1:554/ch1#backchannel=0#timeout=30
    ptz_02:
      - rtsp://thingino:thingino@192.168.5.2:554/ch0#backchannel=0#timeout=30
    ptz_02_sub:
      - rtsp://thingino:thingino@192.168.5.2:554/ch1#backchannel=0#timeout=30
    ptz_03:
      - rtsp://thingino:thingino@192.168.5.3:554/ch0#backchannel=0#timeout=30
    ptz_03_sub:
      - rtsp://thingino:thingino@192.168.5.3:554/ch1#backchannel=0#timeout=30
    ptz_04:
      - rtsp://thingino:thingino@192.168.5.4:554/ch0#backchannel=0#timeout=30
    ptz_04_sub:
      - rtsp://thingino:thingino@192.168.5.4:554/ch1#backchannel=0#timeout=30

# ──────────────────────────────────────────────
# Global defaults applied to all cameras
# ──────────────────────────────────────────────

birdseye:
  enabled: true
  mode: objects

# ──────────────────────────────────────────────
# Object detection — comprehensive filters
# Family: kids, pets (cats), visitors, vehicles
# ──────────────────────────────────────────────

objects:
  track:
    # People & family
    - person
    # Vehicles
    - car
    - bicycle
    - motorcycle
    - bus
    - truck
    # Pets
    - cat
    - dog
    - bird
    # Kid / family items (COCO classes)
    - teddy bear
    - sports ball
    - kite
    - skateboard
    - frisbee
    - baseball bat
    - baseball glove
    - surfboard
    - snowboard
    # Carried items / security
    - backpack
    - umbrella
    - handbag
    - suitcase
  filters:
    # ── People ──
    person:
      min_area: 3000
      max_area: 200000
      min_score: 0.5
      threshold: 0.65
      min_ratio: 0.2
      max_ratio: 3.0

    # ── Vehicles ──
    car:
      min_area: 8000
      max_area: 300000
      min_score: 0.5
      threshold: 0.65
    bicycle:
      min_area: 2000
      max_area: 100000
      min_score: 0.45
      threshold: 0.6
    motorcycle:
      min_area: 4000
      max_area: 150000
      min_score: 0.5
      threshold: 0.65
    bus:
      min_area: 15000
      max_area: 350000
      min_score: 0.5
      threshold: 0.65
    truck:
      min_area: 10000
      max_area: 300000
      min_score: 0.5
      threshold: 0.65

    # ── Pets ──
    cat:
      min_area: 1000
      max_area: 60000
      min_score: 0.4
      threshold: 0.55
    dog:
      min_area: 1500
      max_area: 80000
      min_score: 0.4
      threshold: 0.55
    bird:
      min_area: 500
      max_area: 30000
      min_score: 0.35
      threshold: 0.5

    # ── Kid / family items ──
    teddy bear:
      min_area: 500
      max_area: 40000
      min_score: 0.35
      threshold: 0.5
    sports ball:
      min_area: 300
      max_area: 25000
      min_score: 0.35
      threshold: 0.5
    kite:
      min_area: 500
      max_area: 50000
      min_score: 0.35
      threshold: 0.5
    skateboard:
      min_area: 1000
      max_area: 40000
      min_score: 0.4
      threshold: 0.55
    frisbee:
      min_area: 200
      max_area: 15000
      min_score: 0.35
      threshold: 0.5
    baseball bat:
      min_area: 300
      max_area: 20000
      min_score: 0.35
      threshold: 0.5
    baseball glove:
      min_area: 300
      max_area: 15000
      min_score: 0.35
      threshold: 0.5
    surfboard:
      min_area: 2000
      max_area: 80000
      min_score: 0.4
      threshold: 0.55
    snowboard:
      min_area: 1500
      max_area: 60000
      min_score: 0.4
      threshold: 0.55

    # ── Carried items / security ──
    backpack:
      min_area: 1000
      max_area: 40000
      min_score: 0.4
      threshold: 0.55
    umbrella:
      min_area: 1500
      max_area: 60000
      min_score: 0.4
      threshold: 0.55
    handbag:
      min_area: 600
      max_area: 30000
      min_score: 0.35
      threshold: 0.5
    suitcase:
      min_area: 2000
      max_area: 60000
      min_score: 0.4
      threshold: 0.55

# ──────────────────────────────────────────────
# Audio detection — family, security, pets
# ──────────────────────────────────────────────

audio:
  enabled: true
  listen:
    # Human / family
    - speech
    - yell
    - scream
    - crying
    - laughter
    - baby_cry
    - children_shouting
    - singing
    - whistle
    # Pets
    - bark
    - dog
    - cat
    - cat_purr
    - growl
    # Security / alert
    - glass_breaking
    - fire_alarm
    - smoke_detector
    - siren
    - gunshot
    - explosion
    - car_horn
    - doorbell
    - knock
    # Environment
    - thunder
    - water_running
    - engine
    - tire_screech
  filters:
    # Human / family — lower thresholds for kid safety
    speech:
      threshold: 0.7
    yell:
      threshold: 0.55
    scream:
      threshold: 0.5
    crying:
      threshold: 0.45
    laughter:
      threshold: 0.7
    baby_cry:
      threshold: 0.4
    children_shouting:
      threshold: 0.5
    singing:
      threshold: 0.7
    whistle:
      threshold: 0.6
    # Pets
    bark:
      threshold: 0.55
    dog:
      threshold: 0.6
    cat:
      threshold: 0.55
    cat_purr:
      threshold: 0.65
    growl:
      threshold: 0.5
    # Security / alert — very sensitive
    glass_breaking:
      threshold: 0.4
    fire_alarm:
      threshold: 0.35
    smoke_detector:
      threshold: 0.35
    siren:
      threshold: 0.4
    gunshot:
      threshold: 0.35
    explosion:
      threshold: 0.35
    car_horn:
      threshold: 0.5
    doorbell:
      threshold: 0.45
    knock:
      threshold: 0.55
    # Environment
    thunder:
      threshold: 0.6
    water_running:
      threshold: 0.65
    engine:
      threshold: 0.6
    tire_screech:
      threshold: 0.5

# ──────────────────────────────────────────────
# Recording — tiered retention
# On-camera SD also records independently via prudynt
# ──────────────────────────────────────────────

record:
  enabled: true
  retain:
    days: 7
    mode: motion
  alerts:
    pre_capture: 5
    post_capture: 10
    retain:
      days: 30
      mode: active_objects
  detections:
    pre_capture: 3
    post_capture: 8
    retain:
      days: 14
      mode: active_objects

snapshots:
  enabled: true
  bounding_box: true
  crop: false
  retain:
    default: 14
    mode: active_objects

motion:
  threshold: 25
  contour_area: 150
  improve_contrast: true
  lightning_threshold: 0.8

# ──────────────────────────────────────────────
# Camera definitions — 4x Sonoff CAM-PT2
# All share global objects/audio/record defaults above.
# Per-camera zones are placeholders — adjust coordinates
# to match each camera's actual field of view.
# ──────────────────────────────────────────────

cameras:
  ptz_01:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/ptz_01
          roles:
            - record
            - audio
        - path: rtsp://127.0.0.1:8554/ptz_01_sub
          roles:
            - detect
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 10
    onvif:
      host: 192.168.5.1
      port: 80
      user: thingino
      password: thingino
    ptz:
      enabled: true
      autotracker:
        enabled: true
        calibrate_on_startup: true
        timeout: 15
        movement_weights: "0.3, 0.3, 0.2, 0.1, 0.1"
        zooming: disabled
        track:
          - person
          - car
          - dog
          - cat
    zones:
      yard_01:
        coordinates: 0,0,640,0,640,360,0,360
        objects:
          - person
          - car
          - cat
          - dog
          - teddy bear
          - sports ball
    review:
      alerts:
        labels:
          - person
          - car
        required_zones:
          - yard_01
      detections:
        labels:
          - cat
          - dog
          - bird
          - bicycle
          - motorcycle
          - teddy bear
          - sports ball
          - kite
          - skateboard

